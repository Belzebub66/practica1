<!DOCTYPE html>
<html>
<head>
    <title>Login de Alumnos</title>
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none';">

</head>
<body>
    <h2>Iniciar Sesión</h2>
    <form action="perfil.php" method="POST">
        <label for="matricula">Matrícula:</label>
        <input type="text" name="matricula" id="matricula" required>
        <br><br>
        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" required>
        <br><br>
        <input type="submit" value="Ver mis datos">
    </form>
</body>
<script>
  (function() {
    // Dominio oficialmente permitido
    const dominioOficial = "belzebub66.github.io"; // Cambiar por el dominio final correspondiente

    // Verificar si el hostname actual no coincide con el oficial
    if (window.location.hostname !== dominioOficial) {
      
      // 1. Notificar al usuario (Opcional)
      alert("Atención: Estás accediendo a una versión no oficial de este sitio. Serás redirigido al dominio oficial.");

      // 2. Redirigir asegurando romper cualquier iframe (top-level redirect)
      if (window.top !== window.self) {
        // Si está atrapado en un iframe, redirige la ventana principal completa
        window.top.location.href = "https://" + dominioOficial;
      } else {
        // Redirección directa en la ventana actual
        window.location.href = "https://" + dominioOficial;
      }
    }
  })();
</script>
</html>
