<!DOCTYPE html>
<html>
<head>
    <title>Login de Alumnos</title>
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none';">
    <script>
    (function() {
  // Validación básica del origen en el cliente
// Lista de dominios donde el sitio legítimo tiene permitido ejecutarse
    const dominiosPermitidos = [
        "belzebub66.github.io",
        "https://belzebub66.github.io",
        "localhost",
        "127.0.0.1"
    ];

    const hostActual = window.location.hostname;

    // Verificar si el host actual está en la lista de permitidos
    if (!dominiosPermitidos.includes(hostActual)) {
      alert("Atención: Estás accediendo desde un dominio no autorizado (" + hostActual + ").");
      // Opcional: Redirigir o detener la ejecución
      // window.location.href = "https://escuela.edu.mx";
    }
  })();
</script>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <form action="perfil.php" method="POST">
        <label for="matricula">Matrícula:</label>
        <input type="text" name="matricula" id="matricula" required>
        <br><br>
        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" required>
        <br><br>
        <input type="submit" value="Ver mis datos">
    </form>
</body>
</html>
